# Weekly external-link check for the docs site (Phase 5c, feature 5c.19).
#
# Out-of-band (scheduled, not a PR blocker): the internal_link / anchor guards
# already validate on-site links on every PR, but external links rot over time
# independently of our changes, so they're checked on a schedule instead.
#
# lychee checks only http(s) links in the built HTML. Which links it skips, and
# why, is written next to each setting in .github/lychee.toml. A broken external
# link turns the scheduled run red so a maintainer can fix or replace it.

name: Docs External Links

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group docs

      # Minify/search/cards are irrelevant to link checking; skip for speed.
      - name: Build docs site
        working-directory: docs_site
        run: uv run python manage.py build_docs --no-search --no-social-cards --no-minify -o "$GITHUB_WORKSPACE/lhsite"

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative internal links
          # (`/docs/...`) against the build output instead of erroring on them.
          # It holds the runner's path, so it stays here; every other setting
          # is in the config file.
          args: >-
            --config .github/lychee.toml
            --root-dir ${{ github.workspace }}/lhsite
            "lhsite/**/*.html"
          fail: true
