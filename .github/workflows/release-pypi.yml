# Build, check and publish django-components to PyPI.
#
# Pushing a tag runs three jobs in order: `build` makes the source tarball and
# the wheel and checks their metadata, `smoke-test` installs the built wheel in
# a clean environment and imports it, and `publish` uploads the files to PyPI.
# A manual run from the Actions tab runs the first two jobs and never publishes.
#
# Release jobs do not use the GitHub Actions cache, so nothing saved by an
# earlier workflow run can end up in the released files.
name: Publish to PyPI

on:
  push:
    tags:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so that a new uv release cannot change how a release is built.
  # Change this number by hand when you want a newer uv.
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'django-components/django-components'
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # By default uv builds the source tarball first and then the wheel from
      # that tarball, so the wheel matches what a source install would get.
      - name: Build a binary wheel and a source tarball
        run: uv build --out-dir dist/

      # Fails when PyPI cannot read the package metadata or display the README.
      - name: Check the built files
        run: uvx --from twine==6.2.0 twine check dist/*.whl dist/*.tar.gz

      - name: Upload the built files
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the built files
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # This job has no checkout, and the environment is new, so the import
      # below can only find the package in the installed wheel.
      - name: Install the built wheel in a clean environment
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/smoke-venv"
          uv pip install \
            --python "$RUNNER_TEMP/smoke-venv/bin/python" \
            --only-binary :all: \
            dist/*.whl

      - name: Import the installed package
        run: |
          "$RUNNER_TEMP/smoke-venv/bin/python" -I -c '
          import importlib.metadata
          import django_components

          print(django_components.__file__)
          print(importlib.metadata.version("django-components"))
          '

  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: >-
      github.repository == 'django-components/django-components'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags')
    permissions:
      # Lets the publish action get a short-lived upload token from PyPI once
      # PyPI trusts this workflow (trusted publishing). Not used while the
      # PYPI_API_TOKEN secret is set.
      id-token: write
    steps:
      - name: Download the built files
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          # While the PYPI_API_TOKEN secret exists, the action uploads with it.
          # When the secret is deleted this value is empty, and the action
          # uses trusted publishing instead.
          password: ${{ secrets.PYPI_API_TOKEN }}
